<style>
/* === replace old header.masthead nav rules with this === */
header.masthead nav{display:flex; gap:28px;}
header.masthead nav a{font-size:13.5px; color:var(--ink-soft); text-decoration:none;}
header.masthead nav a:hover{color:var(--ink); text-decoration:none;}

.nav-toggle{
  display:none;
  background:none; border:1px solid var(--line-strong); border-radius:6px;
  width:38px; height:34px; padding:0; cursor:pointer;
  position:relative;
}
.nav-toggle span, .nav-toggle span::before, .nav-toggle span::after{
  content:""; position:absolute; left:9px; right:9px; height:2px;
  background:var(--ink); transition:transform .2s ease, opacity .2s ease;
}
.nav-toggle span{top:16px;}
.nav-toggle span::before{top:-7px;}
.nav-toggle span::after{top:7px;}
.nav-toggle.open span{background:transparent;}
.nav-toggle.open span::before{transform:translateY(7px) rotate(45deg);}
.nav-toggle.open span::after{transform:translateY(-7px) rotate(-45deg);}

/* === inside your existing @media (max-width: 760px){ } block,
       replace the header.masthead / nav lines with these === */
@media (max-width: 760px){
  header.masthead{padding:16px 22px; flex-wrap:wrap;}
  .nav-toggle{display:block;}
  header.masthead nav{
    display:flex; flex-direction:column; gap:0;
    width:100%; max-height:0; overflow:hidden;
    transition:max-height .25s ease;
    order:3;
  }
  header.masthead nav.open{max-height:300px; margin-top:16px;}
  header.masthead nav a{
    padding:12px 0; border-top:1px solid var(--line); font-size:15px;
  }
  .hero{padding:70px 22px 60px;}
  /* keep the rest of your existing rules in this block (hero h1, .wrap, etc.) unchanged */
}
</style>

<!-- === replace your existing <header class="masthead">...</header> with this === -->
<header class="masthead">
  <div class="name">Braedon Baker</div>
  <button class="nav-toggle" id="navToggle" aria-label="Toggle navigation" aria-expanded="false"><span></span></button>
  <nav id="siteNav">
    <a href="#skills">Skills</a>
    <a href="#experience">Experience</a>
    <a href="#projects">Projects</a>
    <a href="#resume">Resume</a>
    <a href="#contact">Contact</a>
  </nav>
</header>
<script>
  (function(){
    var btn = document.getElementById('navToggle');
    var nav = document.getElementById('siteNav');
    btn.addEventListener('click', function(){
      var isOpen = nav.classList.toggle('open');
      btn.classList.toggle('open', isOpen);
      btn.setAttribute('aria-expanded', isOpen);
    });
    nav.querySelectorAll('a').forEach(function(link){
      link.addEventListener('click', function(){
        nav.classList.remove('open');
        btn.classList.remove('open');
        btn.setAttribute('aria-expanded', false);
      });
    });
  })();
</script>
